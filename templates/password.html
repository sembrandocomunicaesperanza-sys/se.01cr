<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contraseña - Sembrando Esperanza</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#1a0033;overflow:hidden;}
.contenedor-login{width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background-size:cover;background-position:center;background-repeat:no-repeat;padding:25px;}
.tarjeta-password{width:90%;max-width:600px;min-height:570px;background:rgba(0,0,0,.68);border:1px solid rgba(255,255,255,.15);border-radius:38px;padding:40px 55px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 15px 45px rgba(0,0,0,.50);backdrop-filter:blur(7px);}
.logo-login{width:145px;height:145px;object-fit:contain;margin-bottom:20px;}
h2{color:#fff;font-size:34px;font-weight:800;margin-bottom:8px;}
.usuario-seleccionado{color:#00ffcc;font-size:21px;font-weight:700;margin-bottom:32px;}
.formulario-password{width:100%;}
.grupo-input{text-align:left;margin-bottom:22px;}
.grupo-input label{display:block;color:rgba(255,255,255,.85);font-size:16px;font-weight:600;margin-bottom:9px;}
.input-password{width:100%;height:62px;padding:0 20px;font-size:19px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.35);border-radius:16px;color:white;outline:none;}
.input-password:focus{border-color:#00ffcc;box-shadow:0 0 0 4px rgba(0,255,204,.12);}
.mensaje-error{width:100%;color:#ff8888;background:rgba(255,80,80,.12);border:1px solid rgba(255,100,100,.25);padding:11px;border-radius:12px;font-size:14px;font-weight:600;margin-bottom:15px;}
.btn-ingresar{width:100%;height:62px;background:#00ffcc;color:#1a0033;border:none;border-radius:16px;font-size:18px;font-weight:800;cursor:pointer;}
.btn-ingresar:hover{background:#00ddb1;}
.enlace-volver{display:inline-block;margin-top:24px;color:rgba(255,255,255,.70);text-decoration:none;font-size:15px;font-weight:600;}
@media(orientation:landscape){
.contenedor-login{background-image:url("{{ url_for('static',filename='Fondo_login-pc.png') }}");}
}
@media(orientation:portrait){
.contenedor-login{background-image:url("{{ url_for('static',filename='Fondo_login-cel.png') }}");padding:18px;}
.tarjeta-password{width:100%;max-width:440px;min-height:570px;padding:32px 25px;border-radius:30px;}
.logo-login{width:120px;height:120px;}
h2{font-size:28px;}
.usuario-seleccionado{font-size:19px;}
}
</style>
</head>
<body>
<div class="contenedor-login">
<div class="tarjeta-password">
<img src="{{ url_for('static',filename='fondo_login.png') }}" class="logo-login" alt="Sembrando Esperanza" onerror="this.style.display='none'">
<h2>Ingresa tu contraseña</h2>
<div class="usuario-seleccionado">{{ usuario_actual }}</div>
<form method="POST" action="{{ url_for('verificar_password') }}" class="formulario-password">
<input type="hidden" name="usuario_actual" value="{{ usuario_actual }}">
<div class="grupo-input">
<label for="password">Contraseña:</label>
<input type="password" id="password" name="password" class="input-password" placeholder="••••••••" required autofocus>
</div>
{% if error %}
<div class="mensaje-error">⚠️ {{ error }}</div>
{% endif %}
<button type="submit" class="btn-ingresar">Ingresar</button>
</form>
<a href="{{ url_for('usuarios') }}" class="enlace-volver">← Volver a usuarios</a>
</div>
</div>
</body>
</html>
